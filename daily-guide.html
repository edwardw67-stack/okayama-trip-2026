function itemRows(rows){return '<div class="list">'+rows.map(r=>'<div class="item"><b>'+r[0]+'</b><small>'+r[1]+'</small>'+A(r[2])+'</div>').join('')+'</div>'}
function sakeRows(rows){return '<div class="list">'+rows.map(r=>'<div class="item sake"><b>'+r[0]+'</b><small>'+r[1]+'</small>'+A(r[2])+'</div>').join('')+'</div>'}
function dayCard(d){return `<article class="day" id="${d.id}"><div class="head ${d.drive?'drive':''}"><div class="num"><b>${d.n}</b><small>${d.date}</small></div><div><h2>${d.title}</h2><p>${d.sub}</p></div></div><div class="body"><div class="warn">${d.drive?'🚗 開車日：可以買酒，不要試飲。':'🚶 非開車日：可試飲，但不要喝到影響隔天。'}</div><div class="grid"><div class="card"><h3>必逛</h3>${chips(d.see)}</div><div class="card"><h3>必吃</h3>${itemRows(d.eat)}</div><div class="card buy"><h3>必買</h3>${chips(d.buy)}</div><div class="card sake"><h3>必喝／必買清酒</h3>${sakeRows(d.sake)}</div><div class="card rain"><h3>雨天備案</h3><div class="item"><small>${d.rain}</small></div></div></div></div></article>`}
document.getElementById('days').innerHTML=days.map(dayCard).join('');
const mustEat=[['岡山 Demi-Katsu','食堂やまと或味司野村。岡山代表 B 級美食。','味司 野村 岡山'],['岡山蝦飯','えびめしや。黑色炒飯系地方味。','えびめしや 万成店 岡山'],['倉敷 Bukkake Udon','ふるいち。便宜、快、有地方感。','ぶっかけ亭本舗 ふるいち 仲店 倉敷'],['三宅商店水果聖代','倉敷午後甜點。','町家喫茶 三宅商店 倉敷'],['姬路關東煮','薑醬油吃法。','姫路おでん 地料理 居酒屋 じごろ小廣'],['まねきえきそば','姬路站快速名物。','まねきのえきそば 姫路駅 在来線店'],['日生牡蠣御好燒','タマちゃん。','お好み焼き タマちゃん 備前 日生'],['銀波莊晚餐','整趟最不該浪費的一餐。','赤穂温泉 絶景露天風呂の宿 銀波荘']];
const mustBuy=[['岡山白桃點心','白桃果凍、果醬、餅乾。','おみやげ街道 晴れの国 岡山駅'],['晴王麝香葡萄點心','果凍、餅乾、糖果。','おみやげ街道 晴れの国 岡山駅'],['吉備糰子','桃太郎系基本款。','廣榮堂 さんすて岡山'],['倉敷帆布','包、收納、日用小物。','倉敷帆布 美観地区'],['倉敷／兒島丹寧','杯墊、零錢包、帽子、小包。','倉敷デニムストリート'],['姬路皮革','小錢包、鑰匙圈、皮件小物。','姫路 レザー お土産'],['赤穗鹽','鹽、鹽味仙貝、鹽糖。','赤穂 塩 お土産'],['備前燒小物','杯子、小盤、小花器。','備前焼 岡山駅']];
const mustSake=[['御前酒','岡山代表酒。純米、菩提酛優先。','おみやげ街道 晴れの国 岡山駅'],['燦然 SANZEN','倉敷玉島菊池酒造。','おみやげ街道 倉敷駅'],['極聖','酒工房 独歩館可買。','酒工房 独歩館 岡山'],['嘉美心','淺口一帶酒造。','おみやげ街道 晴れの国 岡山駅'],['竹林','丸本酒造。看見雄町米可買。','おみやげ街道 晴れの国 岡山駅'],['龍力','姬路、播州代表酒。','山陽百貨店 姫路 地酒 龍力'],['忠臣蔵','赤穗代表地酒。','奥藤酒造郷土館 忠臣蔵'],['多賀治','十八盛酒造。兒島日買。','十八盛酒造 児島'],['大典白菊','備中高梁方向代表酒。','白菊酒造 高梁'],['雄町米關鍵字','看到備前雄町、雄町，優先度提高。','岡山 地酒 雄町']];
function summaryBox(id,title,rows){return `<div class="card" id="${id}"><h3>${title}</h3>${itemRows(rows)}</div>`}
document.getElementById('summary').innerHTML='<div class="grid">'+summaryBox('mustEat','必吃總表',mustEat)+summaryBox('mustBuy','必買總表',mustBuy)+summaryBox('mustSake','清酒總表',mustSake)+'</div>';
document.querySelectorAll('a[href^="#"]').forEach(a=>{a.addEventListener('click',e=>{const id=a.getAttribute('href').slice(1);const el=document.getElementById(id);if(el){e.preventDefault();history.replaceState(null,'','#'+id);el.scrollIntoView({behavior:'smooth',block:'start'});}})});
</script>
