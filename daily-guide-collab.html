const days=[
{id:'d1',n:'01',date:'6/10 三',title:'抵達岡山，直奔倉敷',sub:'岡山機場 → 倉敷｜住 Dormy Inn 倉敷',drive:false,see:[L('岡山桃太郎機場','岡山桃太郎空港'),L('倉敷站北口','倉敷駅北口'),L('Dormy Inn 倉敷','天然温泉 阿智の湯 ドーミーイン倉敷'),L('倉敷美觀地區','倉敷美観地区')],eat:[['ふるいち 仲店','倉敷名物。第一晚簡單吃。','ぶっかけ亭本舗 ふるいち 仲店 倉敷']],buy:[L('便利商店飲料宵夜','セブンイレブン 倉敷美観地区'),L('隔天早餐備品','マルナカ 倉敷駅前店')],sake:[['燦然小瓶','第一晚買一支回飯店慢喝。','おみやげ街道 倉敷駅']],rain:'下雨就直接回 Dormy 泡湯。'},

{id:'d3',n:'03',date:'6/12 五',title:'倉敷轉場岡山，後樂園與岡山城',sub:'倉敷 → 岡山｜住 Hotel Abest Grande Okayama',drive:false,see:[L('岡山後樂園','岡山後楽園'),L('岡山城','岡山城 烏城'),L('岡山站','岡山駅'),L('AEON MALL 岡山','イオンモール岡山')],eat:[['食堂やまと','Demi 豬排丼或中華そば。','食堂やまと 岡山'],['400℃ PIZZA','蜂蜜藍紋起司口味。','400℃ PIZZA 岡山']],buy:[L('白桃果凍','おみやげ街道 晴れの国 岡山駅'),L('晴王麝香葡萄點心','おみやげ街道 晴れの国 岡山駅'),L('吉備糰子','廣榮堂 さんすて岡山')],sake:[['御前酒','岡山代表銘柄。','おみやげ街道 晴れの国 岡山駅'],['嘉美心','看到純米吟釀可買。','おみやげ街道 晴れの国 岡山駅']],rain:'後樂園縮短，岡山城照去，剩下時間丟 AEON。'},
{id:'d4',n:'04',date:'6/13 六',title:'吉備津神社＋酒工房 独歩館',sub:'岡山市區日｜住 Hotel Abest Grande Okayama',drive:false,see:[L('吉備津神社','吉備津神社 岡山'),L('杜之街 Grace','杜の街グレース 岡山'),L('酒工房 独歩館','酒工房 独歩館 岡山'),L('AEON MALL 岡山','イオンモール岡山')],eat:[['えびめしや','岡山蝦仁飯。','えびめしや 万成店 岡山'],['山冨士 本町店','岡山站附近拉麵。','中華そば 山冨士 本町店 岡山']],buy:[L('吉備津神社御守','吉備津神社 授与所'),L('岡山水果點心','おみやげ街道 晴れの国 岡山駅'),L('岡山地酒','おみやげ街道 晴れの国 岡山駅')],sake:[['極聖','酒工房 独歩館最順路。','酒工房 独歩館 岡山'],['独歩啤酒','也可以買地方啤酒。','酒工房 独歩館 岡山']],rain:'雨大就改 AEON、杜之街、酒工房。'},
{id:'d5',n:'05',date:'6/14 日',title:'自駕前往姬路與書寫山',sub:'岡山取車 → 姬路｜住 Hotel Monterey Himeji',drive:true,see:[L('Nippon 岡山站東口','ニッポンレンタカー 岡山駅東口'),L('書寫山纜車','書写山ロープウェイ'),L('書寫山圓教寺','書写山 圓教寺'),L('Hotel Monterey Himeji','ホテルモントレ姫路')],eat:[['まねきのえきそば','姬路站名物。','まねきのえきそば 姫路駅 在来線店'],['じごろ小廣','姬路關東煮，薑醬油吃法。','姫路おでん 地料理 居酒屋 じごろ小廣']],buy:[L('姬路皮革','姫路 レザー お土産'),L('播州素麵','山陽百貨店 姫路 播州素麺'),L('姬路地酒','山陽百貨店 姫路 地酒')],sake:[['龍力','姬路、播州代表酒。','山陽百貨店 姫路 地酒 龍力'],['播州一献','姬路附近常見。','ピオレ姫路 地酒 播州一献']],rain:'雨大取消書寫山，改姬路站、Piole、山陽百貨。'},
{id:'d6',n:'06',date:'6/15 一',title:'姬路城，入住銀波莊',sub:'姬路 → 日生 → 赤穗｜住銀波莊',drive:true,see:[L('姬路城','姫路城'),L('好古園','姫路城西御屋敷跡庭園 好古園'),L('日生','日生駅'),L('銀波莊','赤穂温泉 絶景露天風呂の宿 銀波荘')],eat:[['タマちゃん','日生牡蠣御好燒。','お好み焼き タマちゃん 備前 日生'],['銀波莊會席晚餐','這餐才是主菜。','赤穂温泉 絶景露天風呂の宿 銀波荘']],buy:[L('姬路城限定商品','姫路城 売店'),L('赤穗鹽','赤穂 塩 お土産'),L('銀波莊土產','赤穂温泉 銀波荘 売店')],sake:[['忠臣蔵','赤穗代表地酒。','奥藤酒造郷土館 忠臣蔵'],['龍力補買','姬路沒買到早上補。','山陽百貨店 姫路 地酒 龍力']],rain:'排隊久或下雨就砍好古園，15:00 準時進銀波莊。'},
{id:'d7',n:'07',date:'6/16 二',title:'備中松山城山城日',sub:'赤穗 → 備中高梁 → 岡山｜住 Dormy Inn 岡山',drive:true,see:[L('赤穗城跡','赤穂城跡'),L('大石神社','赤穂大石神社'),L('備中松山城','備中松山城'),L('城見橋公園駐車場','城見橋公園駐車場 備中松山城')],eat:[['赤穗鹽拉麵','赤穗就是鹽。','赤穂 塩ラーメン'],['岡山站晚餐','回岡山後再吃正式一餐。','さんすて岡山 レストラン']],buy:[L('赤穗鹽','赤穂 塩 お土産'),L('大典白菊','白菊酒造 高梁'),L('岡山站補貨','おみやげ街道 晴れの国 岡山駅')],sake:[['大典白菊','備中高梁代表酒。','白菊酒造 高梁'],['御前酒補買','高梁不順就回岡山買。','おみやげ街道 晴れの国 岡山駅']],rain:'雨天直接砍備中松山城。'},
{id:'d8',n:'08',date:'6/17 三',title:'兒島／鷲羽山／Outlet 彈性日',sub:'岡山出發自駕｜住 Dormy Inn 岡山',drive:true,see:[L('兒島 Jeans Street','児島ジーンズストリート'),L('十八盛酒造','十八盛酒造 児島'),L('鷲羽山展望台','鷲羽山展望台'),L('三井 Outlet 倉敷','三井アウトレットパーク 倉敷')],eat:[['倉敷ふるいち補吃','前面沒吃到就補。','ぶっかけ亭本舗 ふるいち 仲店 倉敷'],['岡山蝦飯補吃','前面沒吃到就補。','えびめしや 万成店 岡山']],buy:[L('兒島丹寧小物','児島ジーンズストリート'),L('桃太郎 Jeans','桃太郎ジーンズ 児島味野本店'),L('Outlet 戰利品','三井アウトレットパーク 倉敷')],sake:[['多賀治 TAGAJI','開車日只能買，回飯店再喝。','十八盛酒造 児島'],['燦然補買','倉敷方向順路可補。','おみやげ街道 倉敷駅']],rain:'6/17 週三，兒島店休風險高。雨天改 Outlet、AEON、岡山站。'},
{id:'d9',n:'09',date:'6/18 四',title:'岡山最後補貨，還車回台灣',sub:'岡山 → 岡山機場｜14:30還車｜17:55起飛',drive:true,see:[L('岡山站','岡山駅'),L('さんすて岡山','さんすて岡山'),L('岡山機場','岡山桃太郎空港'),L('Nippon 還車','ニッポンレンタカー 岡山空港')],eat:[['味司野村','還沒吃 Demi-Katsu 就補。','味司 野村 岡山'],['えびめしや','還沒吃蝦飯就補。','えびめしや 万成店 岡山']],buy:[L('白桃果凍','おみやげ街道 晴れの国 岡山駅'),L('麝香葡萄餅乾','おみやげ街道 晴れの国 岡山駅'),L('水果罐頭','おみやげ街道 晴れの国 岡山駅'),L('吉備糰子','廣榮堂 さんすて岡山'),L('地酒小瓶','おみやげ街道 晴れの国 岡山駅')],sake:[['最後總補貨','御前酒、嘉美心、竹林、極聖、雄町米小瓶。','おみやげ街道 晴れの国 岡山駅']],rain:'不排遠點。補貨、加油、準時還車。'}
];
function chips(arr){return '<div class="chips">'+arr.map(x=>`<a class="chip" target="_blank" href="${M(x[1])}">${x[0]}</a>`).join('')+'</div>'}
function itemRows(rows){return rows.map(r=>`<div class="item"><b>${r[0]}</b><small>${r[1]}</small>${A(r[2])}</div>`).join('')}
function memo(id){return `<div class="memo"><h3>Lite Memo</h3><p>存在這台手機瀏覽器。要給旅伴看，按複製後貼 LINE。</p><textarea id="memo-${id}" placeholder="今天臨時想記什麼，直接打在這裡…"></textarea><div class="memoActions"><button class="memoBtn dark" onclick="copyMemo('${id}')">複製 Memo</button><button class="memoBtn" onclick="clearMemo('${id}')">清空</button></div><div class="saved" id="saved-${id}">自動儲存</div></div>`}
function card(d){return `<article class="card ${d.drive?'drive':''}" id="${d.id}"><div class="head"><div class="num"><b>${d.n}</b><small>${d.date}</small></div><div><h2>${d.title}</h2><p>${d.sub}</p></div></div><div class="grid"><div class="box"><h3>必逛</h3>${chips(d.see)}</div><div class="box"><h3>必吃</h3>${itemRows(d.eat)}</div><div class="box"><h3>必買</h3>${chips(d.buy)}</div><div class="box"><h3>必喝／必買清酒</h3>${itemRows(d.sake)}</div><div class="box"><h3>雨天備案</h3><div class="item"><small>${d.rain}</small></div></div></div>${memo(d.id)}</article>`}
document.getElementById('days').innerHTML=days.map(card).join('');
function key(id){return 'okayama-lite-memo-'+id}
function initMemo(){days.forEach(d=>{const t=document.getElementById('memo-'+d.id);const s=document.getElementById('saved-'+d.id);t.value=localStorage.getItem(key(d.id))||'';t.addEventListener('input',()=>{localStorage.setItem(key(d.id),t.value);s.textContent='已儲存 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});});});}
function copyMemo(id){const d=days.find(x=>x.id===id);const t=document.getElementById('memo-'+id);const text=`${d.date} ${d.title}\n${t.value||'(空白)'}`;navigator.clipboard.writeText(text).then(()=>document.getElementById('saved-'+id).textContent='已複製，可貼到 LINE');}
function clearMemo(id){if(confirm('確定清空這天 Memo？')){localStorage.removeItem(key(id));document.getElementById('memo-'+id).value='';document.getElementById('saved-'+id).textContent='已清空';}}
initMemo();
</script>
</body></html>
