ementById('days').innerHTML=days.map(day).join('');document.getElementById('souvenirSakeSec').innerHTML=`<details class="sake"><summary><div class="head"><div class="num"><b>${omiyage.length+sake.length}</b><small>項</small></div><div><h2>伴手禮與清酒清單</h2><p>最後採買、喝酒、買酒時看這張</p></div><div>⌄</div></div></summary><div class="body"><div class="box stack"><div class="subhead">伴手禮</div>${rows(omiyage)}<div class="subhead">可去酒造</div>${rows(sake.slice(0,2))}<div class="subhead">推薦清酒</div>${rows(sake.slice(2))}</div></div></details>`;function openCard(id){let target=document.getElementById(id);if(id==='souvenirSake')target=document.querySelector('#souvenirSakeSec details')||target;if(target&&target.tagName.toLowerCase()==='details')target.open=true;if(target)target.scrollIntoView({behavior:'smooth',block:'start'});}document.querySelectorAll('.nav a').forEach(a=>a.onclick=e=>{const href=a.getAttribute('href');if(href&&href.startsWith('#')){e.preventDefault();let id=href.slice(1);history.replaceState(null,'','#'+id);openCard(id)}});if(location.hash)setTimeout(()=>openCard(location.hash.slice(1)),200);</script></body></html>
