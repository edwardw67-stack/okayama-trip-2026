name: Add weekdays to daily card headers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add weekdays to mobile page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile.html')
          s = p.read_text()
          reps = {
            "d:'6/10'": "d:'6/10 三'",
            "d:'6/11'": "d:'6/11 四'",
            "d:'6/12'": "d:'6/12 五'",
            "d:'6/13'": "d:'6/13 六'",
            "d:'6/14'": "d:'6/14 日'",
            "d:'6/15'": "d:'6/15 一'",
            "d:'6/16'": "d:'6/16 二'",
            "d:'6/17'": "d:'6/17 三'",
            "d:'6/18'": "d:'6/18 四'",
          }
          for a,b in reps.items():
            s = s.replace(a,b)
          p.write_text(s)

          idx = Path('index.html')
          if idx.exists():
            t = idx.read_text()
            t = t.replace('mobile.html?v=9', 'mobile.html?v=10')
            t = t.replace('mobile.html?v=8', 'mobile.html?v=10')
            t = t.replace('mobile.html?v=7', 'mobile.html?v=10')
            idx.write_text(t)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html index.html
          git commit -m "Add weekdays to daily card headers" || exit 0
          git push
