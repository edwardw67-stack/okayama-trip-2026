name: Add iPhone home screen icon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate icons and manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib, json, math

          def png(path, size):
              W=H=size
              img=[]
              def blend(c1,c2,t): return tuple(int(c1[i]*(1-t)+c2[i]*t) for i in range(3))+(255,)
              bg1=(71,106,153); bg2=(169,206,220)
              for y in range(H):
                  row=[]
                  for x in range(W):
                      t=(x+y)/(2*(W-1))
                      r,g,b,a=blend(bg1,bg2,t)
                      # peach sun
                      cx,cy=int(W*.32),int(H*.31); rad=int(W*.22)
                      d=math.hypot(x-cx,y-cy)
                      if d<rad:
                          k=d/rad
                          pr=int(247*(1-k)+244*k); pg=int(201*(1-k)+142*k); pb=int(211*(1-k)+160*k)
                          r=int(r*.25+pr*.75); g=int(g*.25+pg*.75); b=int(b*.25+pb*.75)
                      # muscat leaf
                      lx,ly=int(W*.46),int(H*.19)
                      if ((x-lx)/28)**2+((y-ly)/14)**2<1 and x>lx-5:
                          r,g,b=185,220,140
                      # bridge arc
                      yy=H*.68-0.16*(x-W*.52)**2/W
                      if abs(y-yy)<max(2,size/90) and W*.18<x<W*.9:
                          r,g,b=255,255,255
                      # sea waves
                      for off in [0, int(H*.09), int(H*.18)]:
                          wy=int(H*.73)+off
                          wave=wy+math.sin(x/W*math.pi*3)*size*.012
                          if abs(y-wave)<max(1.5,size/130):
                              r,g,b=255,255,255
                      row.extend([r,g,b,a])
                  img.append(row)
              raw=b''.join(b'\x00'+bytes(row) for row in img)
              def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              data=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',W,H,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
              Path(path).write_bytes(data)

          png('apple-touch-icon.png',180)
          png('icon-192.png',192)
          png('icon-512.png',512)
          Path('manifest.webmanifest').write_text(json.dumps({
              'name':'岡山倉敷9天8夜',
              'short_name':'岡山旅行',
              'start_url':'./?v=11',
              'display':'standalone',
              'background_color':'#f2f2f7',
              'theme_color':'#476a99',
              'icons':[
                  {'src':'apple-touch-icon.png','sizes':'180x180','type':'image/png','purpose':'any maskable'},
                  {'src':'icon-192.png','sizes':'192x192','type':'image/png','purpose':'any maskable'},
                  {'src':'icon-512.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}
              ]
          }, ensure_ascii=False, indent=2))

          tags='''<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=11"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=11"><link rel="manifest" href="manifest.webmanifest?v=11"><meta name="theme-color" content="#476a99"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="岡山旅行"><meta name="apple-mobile-web-app-status-bar-style" content="default">'''
          for name in ['mobile.html','index.html']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text()
              if 'apple-touch-icon.png' not in s:
                  s=s.replace('<title>岡山倉敷9天8夜</title>', '<title>岡山倉敷9天8夜</title>'+tags)
              s=s.replace('mobile.html?v=10','mobile.html?v=11').replace('mobile.html?v=9','mobile.html?v=11')
              p.write_text(s)
          PY
      - name: Commit icon files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png manifest.webmanifest mobile.html index.html
          git commit -m "Add iPhone home screen icon" || exit 0
          git push
