,'12:20','好古園','時間夠就順走。','好古園 姬路'],['13:20','14:10','タマちゃん','日生牡蠣御好燒。','タマちゃん 日生 牡蠣お好み焼き','dark'],['15:00','15:30','銀波莊','準時入住。','赤穗溫泉 銀波莊'],['16:00','17:30','銀波莊溫泉','看海泡湯。','赤穗溫泉 銀波莊'],['18:00','19:30','銀波莊會席晚餐','鯛魚鹽釜燒＋蒸穴子飯。','赤穗溫泉 銀波莊','dark']],note:'銀波莊不是睡覺用，是拿來看海泡湯吃飯的。不要晚到。'}, {n:'07',d:'6/16',drive:1,title:'牛窗海線回岡山',sub:'赤穗 → 牛窗 → 岡山｜約 2～3 小時',spots:[['07:30','09:00','銀波莊晨湯與早餐','10:00 前退房。','赤穗溫泉 銀波莊'],['11:30','12:40','牛窓 海鮮午餐','現場看營業狀況挑。','牛窓 海鮮 レストラン','dark'],['13:00','14:30','牛窓橄欖園','看海景與散步。','牛窓オリーブ園'],['16:00','16:30','Dormy Inn 岡山','Check-in。','Dormy Inn Okayama'],['18:00','19:00','味司 野村','Demi-katsu 丼。','味司 野村 岡山','dark']]}, {n:'08',d:'6/17',drive:1,title:'兒島丹寧與鷲羽山夕陽',sub:'岡山 → 兒島｜約 50～70 分',spots:[['11:00','12:10','兒島牛仔褲大街','兒島最核心逛街點。','児島ジーンズストリート'],['12:20','13:10','兒島章魚鹽味炒麵','下津井鮮章魚＋在地鹽巴。','児島 たこ塩焼きそば','dark'],['13:30','14:20','桃太郎 JEANS','代表品牌。','桃太郎ジーンズ 児島 味野本店'],['14:30','15:20','BIG JOHN 兒島本店','日本丹寧老牌。','BIG JOHN 児島本店'],['18:20','19:20','鷲羽山展望台','18:30 前到，看瀨戶大橋夕陽。','鷲羽山展望台']],note:'不要在鷲羽山硬找晚餐。重點是夕陽。'}, {n:'09',d:'6/18',drive:1,title:'機場還車返台',sub:'岡山市區 → 岡山機場｜約 35～50 分',spots:[['10:00','11:00','Dormy Inn 岡山','退房。','Dormy Inn Okayama'],['11:10','12:20','岡山站周邊','補買伴手禮。','岡山駅'],['12:30','13:20','味司 野村','如果前面沒吃到，最後一天補。','味司 野村 岡山','dark'],['14:30','14:50','Nippon 岡山機場店','14:30 前還車。','Nippon Rent-A-Car Okayama Airport'],['15:00','17:55','岡山桃太郎機場','報到、安檢、起飛。','岡山桃太郎機場']] }];function card(c,i,type){return '<details class="'+type+'" '+(i==0?'open':'')+'><summary><div class="head"><div class="num"><b>'+String(i+1).padStart(2,'0')+'</b><small>'+type+'</small></div><div><h2>'+c[0]+'</h2><p>'+c[1]+'</p></div><div class="chev">⌄</div></div></summary><div class="body"><div class="summary">'+c[2]+'</div><div class="box"><a class="btn" target="_blank" href="'+M(c[3])+'">導航</a></div></div></details>'}function spot(s){return '<div class="item"><span class="time">'+s[0]+' → '+s[1]+'</span><b>'+s[2]+'</b><small>'+s[3]+'</small><a class="btn '+(s[5]||'')+'" target="_blank" href="'+M(s[4])+'">導航</a></div>'}document.getElementById('bookings').innerHTML=bookings.map((b,i)=>card(b,i,'order')).join('');document.getElementById('trafficCards').innerHTML=traffic.map((b,i)=>card(b,i,'traffic')).join('');document.getElementById('days').innerHTML=days.map((d,i)=>'<details id="d'+(i+1)+'" class="'+(d.drive?'drive':'')+'" '+(i==0?'open':'')+'><summary><div class="head"><div class="num"><b>'+d.n+'</b><small>'+d.d+'</small></div><div><h2>'+d.title+'</h2><p>'+d.sub+'</p></div><div class="chev">⌄</div></div></summary><div class="body"><div class="box"><h3>預估到達 / 離開時間</h3>'+d.spots.map(spot).join('')+'</div>'+(d.note?'<div class="note">'+d.note+'</div>':'')+'</div></details>').join('');</script></body></html>
